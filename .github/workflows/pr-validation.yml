name: PR Validation

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.0
          cache: pnpm

      # --break-system-packages is not needed for pnpm; --frozen-lockfile
      # enforces the committed lockfile is authoritative in CI.
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test -- --coverage

      - name: Build
        run: pnpm build

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  infra-lint:
    name: Bicep lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Bicep templates
        run: |
          if [ -d infrastructure/modules ] && [ "$(find infrastructure -name '*.bicep' | wc -l)" -gt 0 ]; then
            az bicep build --file infrastructure/environments/dev/main.bicep --stdout > /dev/null
          else
            echo "No Bicep templates yet - skipping (tracked in ROADMAP.md)"
          fi

  # container-build, container-scan, and SBOM generation are added once
  # apps/web, apps/api, and apps/mcp-server have committed Dockerfiles.
  # Tracked in ROADMAP.md Phase 8.

