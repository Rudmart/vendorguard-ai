name: vendorguard-ai

services:
  postgres:
    image: postgres:16-alpine
    container_name: vendorguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vendorguard
      POSTGRES_PASSWORD: vendorguard_dev_only
      POSTGRES_DB: vendorguard
    ports:
      - "5432:5432"
    volumes:
      - vendorguard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendorguard -d vendorguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Azurite emulates Azure Blob Storage for local development only.
  # Never point Azurite credentials at a deployed environment.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.30.0
    container_name: vendorguard-azurite
    restart: unless-stopped
    command: "azurite --blobHost 0.0.0.0 --blobPort 10000 --silent"
    ports:
      - "10000:10000"
    volumes:
      - vendorguard-azurite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 10000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vendorguard-postgres-data:
  vendorguard-azurite-data:
